.goal{margin:12px 0 6px}
.o,.b,.g{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.o:active,.b:active,.g:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.b{background:var(--coin);color:#1c2340;font-size:19px}

.bar{height:20px;border:3px solid var(--ink);background:var(--card)}
.bar i{background:linear-gradient(90deg,#ffc233,#ff9f1c)}

.react{display:flex;align-items:center;gap:8px}.react>div{flex:1}

.react svg,.stage svg{animation:pop .35s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.prize{font-size:72px;align-self:center;animation:pop .5s}
</style>
